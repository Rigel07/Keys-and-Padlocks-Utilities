name: Build Utility Machines

on:
  push:            # cualquier rama, cualquier archivo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir TODOS los zip del repo
        run: |
          find . -name "*.zip" -not -path "./.git/*" | while read z; do
            echo "Descomprimiendo $z"
            unzip -o "$z" -d "$(dirname "$z")"
          done

      - name: Localizar el proyecto (carpeta con build.gradle)
        id: proj
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "No hay build.gradle"; ls -R; exit 1; fi
          DIR=$(dirname "$F")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Commitear el código descomprimido
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Código descomprimido automáticamente"
          git push || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Compilar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: utilitymachines-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
