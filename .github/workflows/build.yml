name: Build Utility Machines

on:
  push:
    branches: [main, master]
    paths:
      - '*.zip'          # solo se lanza cuando subes/cambias un zip
  workflow_dispatch:     # botón manual en la pestaña Actions

permissions:
  contents: write        # para commitear lo descomprimido y crear la release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir TODOS los zip del repo
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Descomprimiendo $z"
            unzip -o "$z" -d .
          done

      - name: Localizar el proyecto (carpeta con build.gradle)
        id: proj
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n 1)")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Commitear el código descomprimido
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Código descomprimido automáticamente [skip ci]"
          git push || true

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Compilar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: utilitymachines-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar

      - name: Crear release con el .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Utility Machines build ${{ github.run_number }}
          files: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
